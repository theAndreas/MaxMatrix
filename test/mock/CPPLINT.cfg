# The mock stands in for the Arduino core and follows its declarations rather than the Google
# style, which is why tools/tidy.sh leaves it out as well: unsigned long where the core has it
# (runtime/int), the strings the tests feed to Serial and read back (runtime/string), binary.h
# included as the core includes it (build/include_subdir).
# readability/nolint: cpplint 2.0.2 takes a NOLINTBEGIN of clang-tidy's checks for no block of
# its own and then reports the NOLINTEND as outside one, even with a NOLINT of its own beside it;
# clang-tidy reads both.
filter=-runtime/int,-runtime/string,-build/include_subdir,-readability/nolint
