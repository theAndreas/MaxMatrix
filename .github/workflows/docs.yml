# The reference from the Doxygen blocks, on GitHub Pages. Every pull request builds it and fails
# on a warning, so that a block that Doxygen cannot read, or a function of the sketch API without
# one, is found before the merge; only main publishes it. Which warnings count is in
# tools/docs.py, what Doxygen reads in the Doxyfile.
name: docs

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first answer worthless. On main, a deployment that
# runs is left to finish, rather than cut off halfway, and the next one waits for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Doxygen
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The .deb files of this job's last run, for tools/apt-install.sh --cache; the newest one comes
      # back. Saved after the install under a new key every run, even when the install failed: what
      # apt downloaded anew is kept, and a mirror slower than a job may wait is overcome over runs.
      - uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ strategy.job-index }}-

      # From apt, as in the Dockerfile, so that CI and the container warn alike.
      - name: Install Doxygen
        run: tools/apt-install.sh --cache ~/apt-archives doxygen

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/apt-archives
          key: apt-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build and check
        run: python3 tools/docs.py

      - name: Hand the pages over
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docu/html

  deploy:
    name: GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
