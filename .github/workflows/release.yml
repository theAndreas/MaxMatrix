# What turns a tag into a release. Triggered by the tag, as the tag is
# the decision: pushing v1.2.0 is releasing 1.2.0.
#
# The checks are not repeated here: this workflow calls ci.yml and static-analysis.yml and
# publishes only once every job of both has passed, so a tag whose checks are red produces no
# release at all. The Arduino Library Manager takes a library from its tags itself; the release
# page is for a person, with the library as a .zip that the Arduino IDE installs with "Add .ZIP
# Library", and the notes GitHub writes from the merged pull requests.
name: Release

on:
  push:
    tags: ['v*']

# Only the publishing job writes: creating a release and attaching a file to it. Declared at the
# top, as a called workflow cannot be granted more than its caller has.
permissions:
  contents: write

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  analysis:
    name: Analysis
    uses: ./.github/workflows/static-analysis.yml

  # library.properties says the version of an Arduino library, and the Arduino IDE shows it;
  # project() in CMakeLists.txt says that of a library of CMake alone. A tag v0.2.0 on a commit
  # that still says 0.1.0 would publish a release that names itself otherwise. Asked here, before
  # anything is published.
  version:
    name: The tag matches the version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ -f library.properties ]; then
            file=library.properties
            version=$(sed -n 's/^version=//p' library.properties)
          else
            file=CMakeLists.txt
            version=$(sed -n 's/^project([^)]* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::The tag says $tag, $file says ${version:-nothing}"
            exit 1
          fi
          echo "Version $version"

  publish:
    name: Publish the release
    needs: [checks, analysis, version]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The project in a folder named after it: what git tracks, without the dev container, CI
      # and the tools, which a user of it does not need. An Arduino library as the Arduino IDE
      # installs it, one of CMake alone with what add_subdirectory() reads, a firmware with its
      # platform/ to build it from. Only what there is: git archive fails on a path it lacks.
      - name: Pack the sources
        run: |
          if [ -f library.properties ]; then
            name=$(sed -n 's/^name=//p' library.properties)
            files=(library.properties)
          else
            name=$(sed -n 's/^project(\([A-Za-z0-9]*\).*/\1/p' CMakeLists.txt)
            files=(CMakeLists.txt cmake)
          fi
          for path in LICENSE README.md src examples platform; do
            if [ -e "$path" ]; then
              files+=("$path")
            fi
          done
          git archive --format=zip --prefix="${name}/" \
            --output="${name}-${GITHUB_REF_NAME}.zip" HEAD \
            -- "${files[@]}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            ./*.zip
